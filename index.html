<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<style>
  /* Garante tamanho mínimo legível em qualquer resolução */
  html { font-size: 14px; min-width: 900px; }
  @media (min-width: 1400px) { html { font-size: 15px; } }
  @media (min-width: 1920px) { html { font-size: 16px; } }
</style>
<title>Carta de Débito — Apis Flora</title>
<style>
  
  :root {
    --verde:#119C57; --verde-escuro:#0A3922; --verde-claro:#D6F0E2; --verde-mid:#0D8848;
    --amarelo:#F6C70D; --amarelo-light:#FEF9E0;
    --cinza-100:#f4f5f6; --cinza-200:#e8eaec; --cinza-400:#9aa3ad; --cinza-600:#5a6472; --cinza-800:#2c3540;
    --branco:#ffffff; --erro:#BF0811; --cinza-verde:#6C8C84; --sombra:0 2px 12px rgba(0,0,0,0.08); --sombra-md:0 4px 24px rgba(0,0,0,0.13);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--cinza-100);color:var(--cinza-800);min-height:100vh}
  .header{background:linear-gradient(135deg,#0A3922 0%,#119C57 70%,#0D8848 100%);color:white;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sombra-md)}
  .header-brand{display:flex;align-items:center;gap:14px}
  .header-logo{height:44px}
  .header-title h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
  .header-title p{font-size:11.5px;opacity:0.72;margin-top:1px}
  .header-right{display:flex;align-items:center;gap:12px}
  .sync-status{font-size:11.5px;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.10);color:white;display:flex;align-items:center;gap:5px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80}
  .sync-dot.off{background:#f87171}
  .sync-dot.loading{background:#fbbf24;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .main{max-width:1600px;margin:0 auto;padding:28px 32px 60px}
  .card{background:var(--branco);border-radius:14px;box-shadow:var(--sombra);overflow:hidden;margin-bottom:18px}
  .card-header{padding:14px 22px;border-bottom:1px solid var(--cinza-200);display:flex;align-items:center;gap:10px}
  .card-header-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .card-header-icon.verde{background:var(--verde-claro)} .card-header-icon.amarelo{background:var(--amarelo-light)}
  .card-header h2{font-size:13.5px;font-weight:600;color:var(--cinza-800)}
  .card-body{padding:22px}
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:11px;font-weight:600;color:var(--cinza-600);text-transform:uppercase;letter-spacing:0.5px}
  .field input,.field select{height:38px;padding:0 11px;border:1.5px solid var(--cinza-200);border-radius:8px;font-family:inherit;font-size:13px;color:var(--cinza-800);background:var(--branco);transition:border-color .15s,box-shadow .15s;outline:none}
  .field input:focus,.field select:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(10,57,34,0.11)}
